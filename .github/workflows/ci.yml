name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen --all-extras
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Type check
        run: uv run mypy app
      - name: SAST (bandit)
        run: uv run bandit -q -r app -c pyproject.toml
      - name: Dependency audit
        run: uvx pip-audit --strict --progress-spinner off || echo "::warning::pip-audit reported issues"
      - name: Tests
        run: uv run pytest -q
      - name: Retrieval eval (no LLM, regression signal)
        run: uv run python -m evals.run retrieval --agent docs
      - uses: actions/upload-artifact@v4
        with:
          name: retrieval-eval
          path: backend/evals/reports/*.md

  # Quality gates against a real model - only when the secret exists (not on forks).
  e2e-eval:
    runs-on: ubuntu-latest
    needs: backend
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - if: env.ANTHROPIC_API_KEY != ''
        run: uv sync --frozen && uv run python -m evals.run e2e --agent docs --provider claude --limit 15

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx prettier --check "src/**/*.{ts,html,scss}"
      - run: npx ng test --watch=false
      - run: npx ng build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
