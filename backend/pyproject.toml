[project]
name = "atlas"
version = "0.1.0"
description = "Atlas - one RAG core, four domain agents (docs, code, meetings, career)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.12",
    "sse-starlette>=2.1",
    "structlog>=24.4",
    "prometheus-client>=0.21",
    "opentelemetry-sdk>=1.28",
    "pyjwt>=2.9",
    "bcrypt>=4.2",
    "langgraph>=0.2.50",
    "langgraph-checkpoint-sqlite>=2.0",
    "anthropic>=0.75",
    "openai>=1.55",
    "chromadb>=0.5.20",
    "sentence-transformers>=3.3",
    "rank-bm25>=0.2.2",
    "PyStemmer>=2.2",
    "pypdf>=5.1",
    "python-docx>=1.1",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
mcp = ["fastmcp>=2.3"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
    "bandit>=1.8",
    "types-PyYAML",
]

[tool.uv]
# CPU-only torch keeps the HF Space image ~2GB smaller than the CUDA build.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "S", "RUF"]
ignore = ["S101", "SIM905"]  # asserts in tests; str.split() word lists read better

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["slow: loads real embedding / reranker models"]

[tool.bandit]
exclude_dirs = ["tests"]
